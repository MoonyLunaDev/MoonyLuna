<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="LHQing的小屋，一个简单记录生活的个人空间。">
    <title>LHQing的小屋</title>
    <style>
        :root {
            color-scheme: light;
            --paper: #f7f4ee;
            --ink: #252a2d;
            --muted: #687176;
            --line: #d9d5cd;
            --green: #365b4a;
            --warm: #b65c3a;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background:
                linear-gradient(rgba(37, 42, 45, 0.035) 1px, transparent 1px),
                var(--paper);
            background-size: 100% 32px;
            color: var(--ink);
            font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
            line-height: 1.8;
        }

        .page {
            width: min(880px, calc(100% - 40px));
            min-height: 100vh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            padding: 30px 0 18px;
            border-bottom: 1px solid var(--line);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .house-mark {
            position: relative;
            width: 34px;
            height: 29px;
            margin-top: 7px;
            background: var(--warm);
        }

        .house-mark::before {
            position: absolute;
            top: -13px;
            left: 2px;
            width: 25px;
            height: 25px;
            content: "";
            background: var(--warm);
            transform: rotate(45deg);
        }

        .house-mark::after {
            position: absolute;
            right: 6px;
            bottom: 0;
            width: 9px;
            height: 15px;
            content: "";
            background: var(--paper);
        }

        h1 {
            margin: 0;
            font-family: Georgia, "Microsoft YaHei", serif;
            font-size: clamp(1.45rem, 4vw, 2rem);
            font-weight: 700;
            letter-spacing: 0;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 8px;
        }

        button {
            min-height: 38px;
            padding: 7px 14px;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: transparent;
            color: var(--ink);
            font: inherit;
            line-height: 1.2;
            cursor: pointer;
        }

        button:hover,
        button:focus-visible {
            border-color: var(--green);
            color: var(--green);
            outline: none;
        }

        main {
            flex: 1;
            padding: 72px 0 80px;
        }

        .intro {
            max-width: 680px;
        }

        .date {
            margin: 0 0 10px;
            color: var(--warm);
            font-size: 0.86rem;
            font-weight: 700;
        }

        h2 {
            margin: 0 0 22px;
            font-family: Georgia, "Microsoft YaHei", serif;
            font-size: clamp(2rem, 7vw, 3.8rem);
            line-height: 1.25;
            letter-spacing: 0;
        }

        .lead {
            max-width: 590px;
            margin: 0;
            color: var(--muted);
            font-size: 1.05rem;
        }

        .notes {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0;
            margin-top: 68px;
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
        }

        .note {
            min-height: 150px;
            padding: 22px 24px 24px 0;
        }

        .note + .note {
            padding-left: 24px;
            border-left: 1px solid var(--line);
        }

        .note h3 {
            margin: 0 0 8px;
            font-size: 1rem;
            letter-spacing: 0;
        }

        .note p {
            margin: 0;
            color: var(--muted);
            font-size: 0.92rem;
        }

        footer {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 8px 24px;
            padding: 20px 0 28px;
            color: var(--muted);
            font-size: 0.82rem;
        }

        footer p {
            margin: 0;
        }

        @media (max-width: 640px) {
            .page {
                width: min(100% - 28px, 880px);
            }

            header {
                align-items: flex-start;
                flex-direction: column;
            }

            nav {
                justify-content: flex-start;
            }

            main {
                padding: 54px 0 60px;
            }

            .notes {
                grid-template-columns: 1fr;
                margin-top: 48px;
            }

            .note,
            .note + .note {
                min-height: auto;
                padding: 18px 0;
                border-left: 0;
            }

            .note + .note {
                border-top: 1px solid var(--line);
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <header>
            <div class="brand">
                <span class="house-mark" aria-hidden="true"></span>
                <h1>LHQing的小屋</h1>
            </div>
            <nav aria-label="小屋导航">
                <button type="button">生活随笔</button>
                <button type="button">照片角落</button>
                <button type="button">最近在读</button>
            </nav>
        </header>

        <main>
            <section class="intro">
                <p class="date">欢迎来坐坐</p>
                <h2>把平常的日子，<br>轻轻放在这里。</h2>
                <p class="lead">
                    这里是 LHQing 的小屋。没有宏大的主题，只是偶尔记下一顿饭、一次散步、一本读到一半的书，以及生活里那些值得留住的小事。
                </p>
            </section>

            <section class="notes" aria-label="生活片段">
                <article class="note">
                    <h3>今日天气</h3>
                    <p>窗外很安静，适合泡一杯茶，慢慢整理最近的思绪。</p>
                </article>
                <article class="note">
                    <h3>生活碎片</h3>
                    <p>把寻常日子写下来，时间久了，也会成为一本自己的故事。</p>
                </article>
                <article class="note">
                    <h3>小屋计划</h3>
                    <p>以后也许会放些照片和随笔，现在先让这里简单地住着。</p>
                </article>
            </section>
        </main>

        <footer>
            <p>这里是 LHQing 的小屋，简单记录生活。</p>
            <p>ICP备案号：<span aria-label="ICP备案号待填写">&nbsp;</span></p>
        </footer>
    </div>
</body>
</html>
